[package]
name = "lipi"
version = "0.1.0"
authors = ["Chad Brokaw <cbrokaw@gmail.com>"]
edition = "2018"
license = "MIT OR Apache-2.0"

[features]
default = ["icu", "fontique"]
icu = ["dep:parley_data", "dep:icu_properties", "dep:icu_segmenter", "dep:icu_locale_core"]
fontique = ["dep:fontique"]

[dependencies]
parley_data = { git = "https://github.com/linebender/parley", optional = true }
parlance = "0.1.0"
icu_properties = { version = "2.1.2", optional = true }
icu_segmenter = { version = "2.1.2", optional = true }
icu_locale_core = { version = "2.1.1", optional = true }
fontique = { version = "0.9.0", optional = true }

[dev-dependencies]
criterion = "0.5"
icu_properties = "2.1.2"

[[bench]]
name = "segment_events"
harness = false
